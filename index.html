<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#10b981"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--cd:#fff;--c2:#e6ecf4;--tx:#0f172a;--mu:#64748b;--bd:#d5dde8;--ac:#059669;--bl:#2563eb;--am:#d97706;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--cd:#131c2e;--c2:#1c2840;--tx:#e8eef8;--mu:#8a98b3;--bd:#22304a;--ac:#10b981;--bl:#60a5fa;--am:#fbbf24;--rd:#f87171}}
:root[data-theme=dark]{--bg:#0b1220;--cd:#131c2e;--c2:#1c2840;--tx:#e8eef8;--mu:#8a98b3;--bd:#22304a;--ac:#10b981;--bl:#60a5fa;--am:#fbbf24;--rd:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.5 Tajawal,system-ui,sans-serif;padding-bottom:88px}
.w{max-width:640px;margin:auto;padding:0 14px}
h1,h2,h3{margin:0}h2,h3{font-size:16px}small{color:var(--mu);font-size:12px}p{margin:8px 0}
.hd{display:flex;align-items:center;gap:10px;padding:14px 0}.hd>div{flex:1}.hd h1{font-size:18px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--ac);display:grid;place-items:center;font-size:22px}
.pill{background:var(--c2);border-radius:20px;padding:5px 12px;font-size:12px;text-align:center}
.ib{background:var(--c2);border:0;color:var(--tx);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
#tk{background:var(--ac);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.g2 .cd{margin:0}
.st b{display:block;font-size:26px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 10px}
.sr{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px}
.bar{height:8px;background:var(--c2);border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--ac);border-radius:8px;transition:width .3s}.fill.o{background:var(--am)}
.ex{border-color:var(--am)}.bdg{background:var(--am);color:#fff;font-size:11px;border-radius:8px;padding:2px 8px}
.b{font:inherit;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;background:var(--c2);color:var(--tx)}
.b.p{background:var(--ac);color:#fff}.b.d{background:var(--rd);color:#fff}.big{padding:13px 34px;font-size:17px;font-weight:700}
.ct{display:flex;align-items:center;gap:10px}.ct b{min-width:22px;text-align:center}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
textarea{resize:vertical}
.gl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}.gl input{width:64px;padding:6px;text-align:center}
.tabs{display:flex;background:var(--c2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:13px;padding:8px 4px;border-radius:10px;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff}
.ring{position:relative;width:230px;margin:14px auto}.ring svg{width:100%}
.tr{fill:none;stroke:var(--c2);stroke-width:8}.pg{fill:none;stroke:var(--ac);stroke-width:8;stroke-linecap:round;stroke-dasharray:339.3}
.tm{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.tm b{font-size:42px;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:center;gap:12px;margin-bottom:10px}
details{margin-top:12px}summary{cursor:pointer;color:var(--mu)}details .g2{margin-top:10px}details label{font-size:12px;color:var(--mu)}
.chart{display:flex;gap:6px;height:130px;align-items:flex-end;margin-top:10px}.cl{flex:1;display:flex;flex-direction:column;align-items:center}
.cb{height:110px;width:100%;display:flex;align-items:flex-end;gap:2px}.cb i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.lg{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0 6px;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.ch2{direction:ltr;display:flex;gap:6px;margin:10px 0 84px}
.ya{display:flex;flex-direction:column;justify-content:space-between;text-align:right;font-size:11px;color:var(--mu);height:180px;line-height:0}
.pl{flex:1;height:180px;position:relative;border-bottom:1px solid var(--bd);background:repeating-linear-gradient(to bottom,var(--c2) 0,var(--c2) 1px,transparent 1px,transparent 18px);display:flex;gap:4px}
.cl2{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bw{position:relative;width:70%;height:100%}.bw i{position:absolute;bottom:0;left:0;right:0;border-radius:5px 5px 0 0}
.lb{position:absolute;top:100%;right:50%;margin-top:8px;transform-origin:100% 0;transform:rotate(-45deg);white-space:nowrap;font-size:11px;color:var(--mu);direction:rtl}
.nt{font-size:13px;color:var(--mu);white-space:pre-wrap;margin-top:4px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;min-width:0;padding:0;background:none;border:0;color:var(--mu);font:inherit;font-size:10px;cursor:pointer;display:grid;gap:2px;justify-items:center}nav button span{font-size:17px}nav button.on{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20;padding:14px}
.mb{background:var(--cd);border-radius:18px;padding:16px;width:100%;max-width:480px;max-height:88vh;overflow:auto}
.mb label{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px}.mh{display:flex;justify-content:space-between;align-items:center}
.ba{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mb label.ck{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:15px}.ck input{width:20px;height:20px}
#t{position:fixed;bottom:92px;inset-inline:16px;margin:auto;max-width:420px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#t.show{opacity:1}#t.er{background:var(--rd);color:#fff}
</style></head><body>
<div class="w">
<div class="hd"><div class="logo">🎓</div><div><h1>طريقي للمعدل 🎯</h1></div><div class="pill"><div id="dy"></div><small id="dt"></small></div><button class="ib" id="th" aria-label="تبديل الوضع الداكن والفاتح" onclick="toggleTheme()"></button></div>
<div id="tk"></div>
<main id="v"></main>
</div>
<nav>
<button data-k="g" onclick="go('g')"><span>🏠</span>الرئيسية</button>
<button data-k="a" onclick="go('a')"><span>🎯</span>الأهداف</button>
<button data-k="p" onclick="go('p')"><span>⏱️</span>بومودورو</button>
<button data-k="e" onclick="go('e')"><span>📝</span>الامتحانات</button>

<button data-k="s" onclick="go('s')"><span>📊</span>الإحصائيات</button>
<button data-k="t" onclick="go('t')"><span>⚙️</span>الضبط</button>
</nav>
<div id="m"></div><div id="t"></div>
<script>
/* ===== أدوات ===== */
const $=s=>document.querySelector(s),KEY='tareeqi_v1',pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ds(new Date());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const wkStart=s=>addD(s,-((pd(s).getDay()+1)%7)); /* السبت = بداية الأسبوع */
const fmt=s=>{const[a,b,c]=s.split('-');return(+c)+'/'+(+b)+'/'+a};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtMin=m=>Math.floor(m/60)+' ساعة و '+(m%60)+' دقيقة';
const empty=t=>`<div class="cd" style="text-align:center;color:var(--mu)">${t}</div>`;
/* ===== البيانات ===== */
const SUB=[['math','الرياضيات','📐','#3b82f6',5],['bio','الأحياء','🧬','#10b981',5],['chem','الكيمياء','🧪','#f59e0b',5],['phy','الفيزياء','⚛️','#a855f7',5],['eng','الإنجليزي','🔤','#14b8a6',5],['gram','العربي - قواعد','📖','#f43f5e',5],['adab','العربي - أدب','📚','#f97316',5],['isl','الإسلامية','🕌','#6366f1',3]];
const DEF=()=>({v:1,subjects:SUB.map(([id,n,i,c,g])=>({id,n,i,c,g,off:false})),goals:{},logs:[],sessions:[],exams:[],resetTs:0,set:{study:45,brk:5,long:15,every:4,sound:true,theme:'auto'}});
const D_RE=/^\d{4}-\d\d-\d\d$/;
const valid=d=>d&&typeof d==='object'&&Array.isArray(d.subjects)&&Array.isArray(d.logs)&&Array.isArray(d.sessions)&&Array.isArray(d.exams)&&d.set&&typeof d.set==='object'
&&d.subjects.every(s=>s&&typeof s.id==='string'&&typeof s.n==='string')&&d.logs.every(l=>l&&typeof l.sid==='string'&&typeof l.n==='number'&&D_RE.test(l.date))
&&d.sessions.every(s=>s&&typeof s.min==='number'&&D_RE.test(s.date))&&d.exams.every(e=>e&&Array.isArray(e.subs)&&D_RE.test(e.date))&&(d.plans==null||(Array.isArray(d.plans)&&d.plans.every(p=>p&&D_RE.test(p.start)&&D_RE.test(p.end)&&p.t&&typeof p.t==='object')));
const mkPlan=(subs,g,rs)=>{const s=wkStart(today()),t={};subs.forEach(x=>{if(!x.off)t[x.id]=(g&&g[x.id]!=null)?g[x.id]:x.g});return{id:uid(),dur:'w1',start:s,end:addD(s,6),t,ts:Date.now(),rs:rs||0}};
const norm=d=>{const had=Array.isArray(d.plans);d=Object.assign(DEF(),d);if(!had)d.plans=[mkPlan(d.subjects,d.goals&&d.goals[wkStart(today())],d.resetTs)];d.set=Object.assign(DEF().set,d.set);d.goals=d.goals||{};d.logs.forEach(l=>l.ts=l.ts||0);d.resetTs=d.resetTs||0;return d};
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(valid(o)){if(!localStorage.getItem(KEY+'_z1')){localStorage.setItem(KEY+'_bak0',r);o.logs=[];o.sessions=[];o.exams=[];localStorage.setItem(KEY+'_z1','1');localStorage.setItem(KEY,JSON.stringify(o))}return norm(o)}}else localStorage.setItem(KEY+'_z1','1')}catch(e){}return norm({})}
function save(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ في هذا المتصفح',1)}syncSoon()}
let S=load(),tab='g',ET='list',CB=[],OP={s:0,t:0};
const act=()=>S.subjects.filter(s=>!s.off);
const sub=id=>S.subjects.find(s=>s.id===id)||{n:'مادة محذوفة',i:'•',c:'#888',g:0};
/* ===== الأهداف ===== */
const WS=()=>wkStart(today()),WE=()=>addD(WS(),6);
function ensureWeek(){const w=WS();if(!S.goals[w]){S.goals[w]={};S.subjects.forEach(s=>S.goals[w][s.id]=s.g)}}
const tgt=s=>{const p=cur();return(p&&p.t[s.id])||0};
const DURL={w1:'أسبوع واحد',w2:'أسبوعان',w3:'ثلاثة أسابيع',w4:'أربعة أسابيع',m:'شهر تقويمي'};
const cur=()=>{const t=today();return S.plans.filter(p=>!p.off&&p.start<=t&&t<=p.end).sort((a,b)=>b.ts-a.ts)[0]};
const inP=s=>{const p=cur();return !!p&&p.t[s.id]!=null};
const planLogs=p=>p?S.logs.filter(l=>l.date>=p.start&&l.date<=p.end&&l.ts>=(p.rs||0)):[];
const curLogs=()=>planLogs(cur());
function span(d,o){const t=pd(today());if(d==='m')return[ds(new Date(t.getFullYear(),t.getMonth()+o,1)),ds(new Date(t.getFullYear(),t.getMonth()+o+1,0))];const s=addD(wkStart(today()),7*o);return[s,addD(s,7*(+d[1])-1)]}
const done=sid=>curLogs().filter(l=>l.sid===sid).reduce((a,l)=>a+l.n,0);
const pct=(d,t)=>t>0?Math.round(d/t*100):null;
function sum(){let T=0,D=0,X=0,R_=0;act().filter(inP).forEach(s=>{const t=tgt(s),d=done(s.id);T+=t;D+=Math.min(d,t);X+=Math.max(0,d-t);R_+=Math.max(0,t-d)});return{T,D,X,R:R_,A:D+X,p:pct(D+X,T)}}
function inc(sid){const s=sub(sid),t=tgt(s,WS()),b=done(sid);S.logs.push({id:uid(),sid,n:1,date:today(),ts:Date.now()});save();R();if(t>0&&b<t&&b+1>=t)toast('🎉 ما شاء الله! أكملت هدف '+s.n)}
function dec(sid){const a=curLogs().filter(l=>l.sid===sid).sort((x,y)=>x.ts-y.ts);if(!a.length)return;const l=a[a.length-1];if(l.n>1)l.n--;else S.logs=S.logs.filter(x=>x!==l);save();R()}
function setG(sid,v){v=Math.max(0,Math.min(99,parseInt(v)||0));ensureWeek();S.goals[WS()][sid]=v;sub(sid).g=v;save();R()}
function newWk(){ask('بدء أسبوع جديد','سيبدأ العدّاد من الصفر لجميع المواد. سجلاتك السابقة تبقى محفوظة في الإحصائيات ولا يُحذف شيء.',[['نعم، متأكد',()=>{const p=cur();if(p)p.rs=Date.now();save();R();toast('بدأ أسبوع جديد ✓')},'p'],['إلغاء']])}
const card=s=>{const t=tgt(s,WS()),d=done(s.id),p=pct(d,t),x=Math.max(0,d-t);
return `<div class="cd${x?' ex':''}"><div class="sr"><b><i class="dot" style="background:${s.c}"></i>${s.i} ${esc(s.n)}</b>${x?`<span class="bdg">🔥 تفوّق (+${x})</span>`:''}</div>
<div class="sr"><small>${d} من ${t} محاضرة</small><small>الإنجاز: ${p==null?'—':p+'%'}</small></div>
<div class="bar"><div class="fill${x?' o':''}" style="width:${p==null?0:Math.min(100,p)}%"></div></div>
<div class="sr" style="justify-content:flex-end"><div class="ct"><button class="b" onclick="dec('${s.id}')" aria-label="إنقاص">−</button><b>${d}</b><button class="b p" onclick="inc('${s.id}')">+1</button></div></div></div>`};
function vGoals(){const m=sum(),p=cur();if(!p)return empty('لا يوجد هدف نشط حالياً.<br>أنشئ هدفاً من صفحة «الأهداف» لتبدأ التسجيل.')+'<button class="b p" style="width:100%" onclick="go(\'a\')">🎯 الذهاب إلى الأهداف</button>';
return `<div class="g2">${[['المستهدف',m.T,''],['المكتمل حتى الآن',m.A,'var(--ac)'],['نسبة الإنجاز',m.p==null?'—':m.p+'%','var(--bl)'],['محاضرات التفوق','🔥 '+m.X,'var(--am)']].map(([a,b,c])=>`<div class="cd st"><small>${a}</small><b style="color:${c}">${b}</b></div>`).join('')}</div>
<div class="sh"><div><h2>🎯 أهداف الفترة الحالية</h2><small>${DURL[p.dur]} · ${fmt(p.start)} ← ${fmt(p.end)}</small></div><button class="b" onclick="newWk()">↻ أسبوع جديد</button></div>
${act().filter(inP).map(card).join('')||empty('لا توجد مواد في هذا الهدف.')}`}
/* ===== بومودورو ===== */
let T={mode:'study',run:false,end:0,left:S.set.study*60000,sid:'',cnt:0};
const tdur=()=>(T.mode==='study'?S.set.study:T.mode==='brk'?S.set.brk:(S.set.long||S.set.brk))*60000;
const left=()=>T.run?Math.max(0,T.end-Date.now()):T.left;
function setMode(k){T.mode=k;T.run=false;T.left=tdur();R()}
function tToggle(){if(T.run){T.left=Math.max(0,T.end-Date.now());T.run=false}else{T.end=Date.now()+T.left;T.run=true}paint()}
function tReset(){T.run=false;T.left=tdur();paint()}
function tSave(){const m=Math.floor((tdur()-T.left)/60000);if(m<1)return;S.sessions.push({id:uid(),sid:T.sid,min:m,date:today(),ts:Date.now(),full:false});save();T.left=tdur();R();toast('تم حفظ '+m+' دقيقة ✓')}
function finish(){const st=T.mode==='study';T.run=false;
if(st){S.sessions.push({id:uid(),sid:T.sid,min:S.set.study,date:today(),ts:Date.now(),full:true});T.cnt++;save()}
T.mode=st?((S.set.long>0&&S.set.every>0&&T.cnt%S.set.every===0)?'long':'brk'):'study';T.left=tdur();R();beep();
modal(`<h3>${st?'✅ أحسنت! انتهت جلسة الدراسة':'⏰ انتهت الاستراحة'}</h3><p>${st?'خذ استراحة قصيرة، وتم حفظ الجلسة في سجل اليوم.':'جاهز لجلسة جديدة متى شئت.'}</p><div class="ba"><button class="b p" onclick="closeM()">حسناً</button></div>`)}
function beep(){if(!S.set.sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime+t);o.start(c.currentTime+t);o.stop(c.currentTime+t+.15)})}catch(e){}}
function paint(){const e=$('#tt');if(!e)return;const l=left(),d=tdur(),m=Math.ceil(l/1000),g=$('#rg');
e.textContent=pad(Math.floor(m/60))+':'+pad(m%60);g.style.strokeDashoffset=339.3*(1-l/d);g.style.stroke=T.mode==='study'?'var(--ac)':'var(--bl)';
$('#ts').textContent=T.run?'جارٍ العدّ…':l<d?'متوقف مؤقتاً':'جاهز للبدء';$('#tb').textContent=T.run?'⏸ إيقاف مؤقت':l<d?'▶ استئناف':'▶ ابدأ';
const el=Math.floor((d-l)/60000),h=(T.mode==='study'&&!T.run&&el>=1)?`<button class="b" onclick="tSave()">💾 حفظ الوقت الفعلي (${el} د)</button>`:'',x=$('#tx');if(x.dataset.h!==h){x.dataset.h=h;x.innerHTML=h}}
function saveSet(){const n=(k,d)=>Math.max(0,Math.min(180,parseInt($(k).value)||d));S.set.study=Math.max(1,n('#p1',45));S.set.brk=Math.max(1,n('#p2',5));S.set.long=n('#p3',15);S.set.every=n('#p4',4);S.set.sound=$('#p5').checked;save();if(!T.run)T.left=tdur();R();toast('تم حفظ الإعدادات ✓')}
function delSes(id){S.sessions=S.sessions.filter(s=>s.id!==id);save();R()}
const sesToday=()=>S.sessions.filter(s=>s.date===today()).sort((a,b)=>b.ts-a.ts);
function vPomo(){const st=S.set,td=sesToday();

/* ===== المزامنة السحابية عبر Google Apps Script (اختيارية ومجانية، تعمل من الملف مباشرة) ===== */
const SK='tareeqi_sync',SYNC={st:'off',col:null,t:null,busy:false,again:false};
try{const c=JSON.parse(localStorage.getItem(SK)||'null');if(c&&c.url&&c.key){SYNC.col=c;SYNC.st='load'}}catch(e){}
const GS=`const KEY='CHANGE-ME-123';
function doGet(e){return out(e.parameter.k===KEY?read():'{"e":"auth"}')}
function doPost(e){const b=JSON.parse(e.postData.contents);if(b.k!==KEY)return out('{"e":"auth"}');file().setContent(b.d);return out('{"ok":1}')}
function file(){const f=DriveApp.getFilesByName('tareeqi-data.json');return f.hasNext()?f.next():DriveApp.createFile('tareeqi-data.json','{}')}
function read(){return file().getBlob().getDataAsString()||'{}'}
function out(s){return ContentService.createTextOutput(s).setMimeType(ContentService.MimeType.JSON)}`;
const syncTxt=()=>({off:'غير مفعّلة (حفظ محلي فقط)',load:'جارٍ الاتصال…',ok:'متزامنة ✓',err:'تعذّرت المزامنة (البيانات محفوظة محلياً)'}[SYNC.st]||'');

async function syncGet(){const r=await fetch(SYNC.col.url+'?k='+encodeURIComponent(SYNC.col.key)),j=await r.json();if(!j||j.e)throw 0;return j}
async function syncPush(){if(!SYNC.col)return;if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;
try{do{SYNC.again=false;const r=await fetch(SYNC.col.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:SYNC.col.key,d:JSON.stringify(S)})}),j=await r.json();if(!j||!j.ok)throw 0}while(SYNC.again);syncSet('ok')}catch(e){syncSet('err')}SYNC.busy=false}
function syncSoon(){if(!SYNC.col)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(syncPush,2000)}

try{const d=await syncGet();if(valid(d)&&(d.u||0)>(S.u||0)){S=norm(d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}applyTheme();if(!T.run)T.left=tdur();R();syncSet('ok')}else await syncPush()}catch(e){syncSet('err')}}
